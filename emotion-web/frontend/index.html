<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Captura de Pantalla</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- TOPBAR -->
    <header id="topbar">
        <div id="topbar-content">
            <h1>Sistema de gestión de emociones en entornos educativos</h1>
            <div id="nav-placeholder">
                <!-- Botones de navegación cuando pasemos a react -->
            </div>
        </div>
    </header>

    <!-- Marco donde se ubica la captura de pantalla -->
    <div id="contenido">
        <div id="contenedor-video">
            <!-- Video de captura de pantalla -->
            <video id="video" autoplay playsinline></video>
            <!-- Canvas para los bounding boxes -->
            <canvas id="overlay"></canvas>
        </div>
        <!-- Panel lateral de logs de emociones -->
        <div id="emociones-columna">
            <div id="emociones"></div>
            <!-- Botones para iniciar y parar captura -->
            <div id="botones">
                <button id="iniciarCaptura">Iniciar captura</button>
                <button id="detenerCaptura">Detener captura</button>
            </div>
        </div>
    </div>

    <!-- Lógica de captura y detección -->
    <script src="script.js"></script>
</body>

</html>
